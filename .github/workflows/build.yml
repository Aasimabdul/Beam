name: Build APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --no-daemon

      - name: Build release APK (unsigned, shrunk) to check final size
        continue-on-error: true
        run: ./gradlew :app:assembleRelease --no-daemon

      - name: APK sizes
        run: ls -l app/build/outputs/apk/*/*.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Beam-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Publish latest debug APK (pre-release, easy phone download)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk Beam-debug.apk
          gh release delete latest-debug --cleanup-tag --yes || true
          gh release create latest-debug Beam-debug.apk --prerelease \
            --title "Beam latest debug build" \
            --notes "Auto-built from main. Debug-signed, for testing. Install by tapping the APK on your phone." \
            --target "$GITHUB_SHA"
